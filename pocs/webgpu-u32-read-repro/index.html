    <p>Mirrors the failing <code>test-backend-ops</code> q4_K x f32 WebGPU fast-path case as closely as possible in a standalone page.</p>
    <button id="run">Run Repro</button>
    <pre id="log">Idle.</pre>
  </div>
  <script type="module">
    const logEl = document.getElementById("log");
    const runBtn = document.getElementById("run");

    const shaderPath = "./mul_mat_reg_tile_q4_K_f32_exact.wgsl";

    function hex32(v) {
      return "0x" + v.toString(16).padStart(8, "0");
    }

    const OUT_FLOATS = 5;
    const DEBUG_EXPECTED = new Uint32Array([
      0xdeadbeef,
      1,
      2,
      3,
    ]);
    const DEBUG_LABELS = [
      "sentinel",
      "sc after k_outer = 0",
      "sc after k_outer = 32",
      "sc after k_outer = 64",
    ];

    function makeScaleValsInput() {
      return new Uint32Array([
        0x04030201,
        0x08070605,
        0x0c0b0a09,
      ]);
    }

    async function run() {
      logEl.textContent = "Running...";
      if (!navigator.gpu) {
        logEl.textContent = "WebGPU unavailable.";
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        logEl.textContent = "No WebGPU adapter.";
        return;
      }

      const requiredFeatures = [];
      if (adapter.features.has("shader-f16")) {
        requiredFeatures.push("shader-f16");
      }
      const device = await adapter.requestDevice({ requiredFeatures });
      device.addEventListener?.("uncapturederror", (event) => {
        console.error(event.error);
      });

      const input = makeScaleValsInput();
      const inBuf = device.createBuffer({
        size: input.byteLength,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
      });
      device.queue.writeBuffer(inBuf, 0, input);

      const outBuf = device.createBuffer({
        size: OUT_FLOATS * 4,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
      });
      const debugWords = DEBUG_EXPECTED.length;
      const debugBuf = device.createBuffer({
        size: debugWords * 4,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
      });
      const debugReadBuf = device.createBuffer({
        size: debugWords * 4,
        usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
      });
      device.pushErrorScope("validation");
      device.pushErrorScope("internal");
      const shader = await fetch(shaderUrl, { cache: "no-store" }).then((r) => r.text());
      const module = device.createShaderModule({ code: shader });
      const info = await module.getCompilationInfo();
      const compilationMessages = info.messages || [];
      const pipeline = device.createComputePipeline({
        layout: "auto",
        compute: { module, entryPoint: "main" },
      });

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: inBuf } },
          { binding: 1, resource: { buffer: outBuf } },
          { binding: 2, resource: { buffer: debugBuf } },
        ],
      });

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginComputePass();
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.dispatchWorkgroups(1, 1, 1);
      pass.end();
      encoder.copyBufferToBuffer(debugBuf, 0, debugReadBuf, 0, debugWords * 4);
      device.queue.submit([encoder.finish()]);
      const internalError = await device.popErrorScope();
      const validationError = await device.popErrorScope();

      await debugReadBuf.mapAsync(GPUMapMode.READ);
      const debugResult = new Uint32Array(debugReadBuf.getMappedRange().slice(0));
      debugReadBuf.unmap();

      const lines = [
        `adapter: ${adapter.info?.vendor || "unknown"} / ${adapter.info?.architecture || "unknown"} / ${adapter.info?.description || "unknown"}`,
        `shader-f16 requested: ${requiredFeatures.includes("shader-f16") ? "yes" : "no"}`,
        "data source: 3 fixed u32 scale words",
        `shader source: ${shaderPath}`,
      ];

      if (compilationMessages.length > 0) {
        lines.push("");
        lines.push("compilation messages:");
        for (const msg of compilationMessages) {
          lines.push(`  ${msg.type}: ${msg.message}`);
        }
      }
      if (internalError || validationError) {
        lines.push("");
        lines.push("device errors:");
        if (internalError) {
          lines.push(`  internal: ${internalError.message}`);
        }
        if (validationError) {
          lines.push(`  validation: ${validationError.message}`);
        }
      }
      lines.push("");
      lines.push("debug words:");
      for (let i = 0; i < DEBUG_LABELS.length; i++) {
        lines.push(`  [${i}] ${DEBUG_LABELS[i]}`);
      }
      lines.push("");
      lines.push("expected:");
      for (let i = 0; i < DEBUG_EXPECTED.length; i++) {
        const prefix = i >= 1 ? ">>" : "  ";
        lines.push(`${prefix} dbg[${i}] = ${hex32(DEBUG_EXPECTED[i])} (${DEBUG_EXPECTED[i]})`);
      }
      lines.push("");
      lines.push("actual:");
      for (let i = 0; i < debugResult.length; i++) {
        const prefix = i >= 1 ? ">>" : "  ";
        const status = debugResult[i] === DEBUG_EXPECTED[i] ? "ok" : "mismatch";
        lines.push(`${prefix} dbg[${i}] = ${hex32(debugResult[i])} (${debugResult[i]}) [${status}]`);
      }
      logEl.textContent = lines.join("\n");
    }

    runBtn.addEventListener("click", () => {
      run().catch((err) => {
        console.error(err);
        logEl.textContent = String(err?.stack || err);
      });
    });
  </script>
</body>
